[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motif-gepa-ko"
version = "0.1.0"
description = "Korean prompt evolution with GEPA and Motif 3"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
modal = ["modal>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
